# ALPHA TRADING SYSTEM — Render 배포 설정
# Render.com → New Web Service → GitHub 저장소 연결 → 자동 감지

services:
  - type: web
    name: alpha-trading-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.js

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: KIS_APP_KEY
        sync: false

      - key: KIS_APP_SECRET
        sync: false

      - key: DART_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: ALLOWED_ORIGIN
        sync: false

      - key: APP_API_KEY
        sync: false

      - key: ALERT_CHECK_SECRET
        sync: false

      - key: ADMIN_LOGIN_ID
        sync: false

      - key: ADMIN_PASSWORD_HASH
        sync: false

      - key: SESSION_SECRET
        sync: false

      - key: SESSION_TTL_MINUTES
        value: "60"

      - key: KBSEC_BASE_URL
        value: "https://developer.kbsec.com:32484"

      - key: KBSEC_APP_KEY
        sync: false

      - key: KBSEC_APP_SECRET
        sync: false

      - key: KBSEC_IP_ADDR
        sync: false

      - key: KBSEC_MAC_ADDR
        sync: false

      - key: KBSEC_TRADING_ENABLED
        value: "false"

      - key: KBSEC_AUTO_TRADING_ENABLED
        value: "false"

      - key: RATE_LIMIT_GENERAL
        value: "60"

      - key: RATE_LIMIT_AI
        value: "10"

    healthCheckPath: /api/health
    autoDeploy: true
